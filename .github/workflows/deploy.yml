name: Plan and deploy
# Pull requests: plan with a read only role and show the changes on the run summary.
# Main: plan, wait for approval in the "production" environment, then apply the same changes.
# Credentials come from GitHub OIDC and expire within the hour. See docs/CICD.md.
on:
  pull_request:
    branches: [main]
    paths:
      - cloud_detection/**
      - infra/api/**
      - infra/alerts/**
      - infra/simulator/**
      - infra/monitoring/**
      - infra/access/**
      - scripts/build_api_package.py
      - scripts/ci_terraform.sh
      - scripts/plan_fingerprint.py
      - .github/workflows/deploy.yml
  push:
    branches: [main]
    paths:
      - cloud_detection/**
      - infra/api/**
      - infra/alerts/**
      - infra/simulator/**
      - infra/monitoring/**
      - infra/access/**
      - scripts/build_api_package.py
      - scripts/ci_terraform.sh
      - scripts/plan_fingerprint.py
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: '1.16.6'
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: python -m pip install ".[test]"
      - run: python -m unittest discover -s tests -v

  plan:
    needs: test
    # Pull requests from forks get no AWS access.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        module: [api, alerts, simulator, monitoring]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: '${{ env.TERRAFORM_VERSION }}', terraform_wrapper: false }
      - name: Read account ID
        # Keep digits only, so a stray space or newline in the secret cannot break the role ARN.
        run: |
          id="$(printf '%s' "$RAW_ACCOUNT_ID" | tr -cd '0-9')"
          [[ ${#id} -eq 12 ]] || { echo "The AWS_ACCOUNT_ID secret must contain a 12-digit account ID" >&2; exit 1; }
          echo "::add-mask::$id"
          echo "AWS_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
        env:
          RAW_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/cloud-detection-github-plan
          role-session-name: plan-${{ matrix.module }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci_terraform.sh plan ${{ matrix.module }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fingerprint-${{ matrix.module }}
          path: plan-fingerprint-${{ matrix.module }}.txt
          retention-days: 7

  deploy:
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production   # required reviewer: the job waits here until approved
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        module: [api, alerts, simulator, monitoring]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: '${{ env.TERRAFORM_VERSION }}', terraform_wrapper: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fingerprint-${{ matrix.module }}
          path: reviewed
      - name: Read account ID
        # Keep digits only, so a stray space or newline in the secret cannot break the role ARN.
        run: |
          id="$(printf '%s' "$RAW_ACCOUNT_ID" | tr -cd '0-9')"
          [[ ${#id} -eq 12 ]] || { echo "The AWS_ACCOUNT_ID secret must contain a 12-digit account ID" >&2; exit 1; }
          echo "::add-mask::$id"
          echo "AWS_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
        env:
          RAW_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/cloud-detection-github-deploy
          role-session-name: deploy-${{ matrix.module }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci_terraform.sh deploy ${{ matrix.module }}
        env:
          REVIEWED_FINGERPRINT_FILE: reviewed/plan-fingerprint-${{ matrix.module }}.txt
