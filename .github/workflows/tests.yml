name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ".[test]"
      - run: python -m unittest discover -s tests -v
      - run: python -m cloud_detection --input examples/cloudtrail.json --output work/findings.json
      - run: python -m cloud_detection etl --input examples/cloudtrail.json --output work/sample-dataset
